<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Inventario de Alimentos</title>
<style>
:root{--bg:#f4f4f4;--card:#fff;--tx:#111;--mu:#666;--br:#dcdcdc;--pr:#0a0a0a;--ok:#d4f0dd;--wa:#fff0c2;--er:#fcd3d3;--in:#d3e4f8;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a0a0a;--card:#151515;--tx:#f2f2f2;--mu:#9a9a9a;--br:#2e2e2e;--pr:#262626;--ok:#1d4a30;--wa:#5a4a12;--er:#5d2222;--in:#1f3a5a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0a0a0a;--card:#151515;--tx:#f2f2f2;--mu:#9a9a9a;--br:#2e2e2e;--pr:#262626;--ok:#1d4a30;--wa:#5a4a12;--er:#5d2222;--in:#1f3a5a;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 Arial,Helvetica,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--pr);z-index:10}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--pr);color:#fff;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;gap:8px}
header h1{font-size:17px;margin:0}header small{opacity:.85;font-size:11px}
nav{display:flex;gap:4px;overflow-x:auto;padding:8px 10px;background:var(--card);border-bottom:1px solid var(--br);position:sticky;top:calc(env(safe-area-inset-top,0px) + 48px);z-index:8}
nav button{border:0;background:none;color:var(--mu);padding:8px 14px;border-radius:8px;font:inherit;font-weight:700;white-space:nowrap;cursor:pointer}
nav button.on{background:var(--pr);color:#fff}
main{max-width:1100px;margin:0 auto;padding:14px}
.card{background:var(--card);border:1px solid var(--br);border-radius:12px;padding:14px;margin-bottom:14px}
h2{font-size:15px;margin:0 0 10px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--br);border-radius:12px;padding:12px}.kpi span{display:block;color:var(--mu);font-size:11px}.kpi b{font-size:20px}
.kpi.er{background:var(--er)}.kpi.wa{background:var(--wa)}
form{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;align-items:end}
label{display:flex;flex-direction:column;font-size:11px;color:var(--mu);gap:3px;font-weight:700}
input,select,textarea{font:inherit;padding:8px;border:1px solid var(--br);border-radius:8px;background:var(--bg);color:var(--tx);width:100%}
button.p,button.s{font:inherit;font-weight:700;padding:9px 14px;border-radius:8px;border:0;cursor:pointer;background:var(--pr);color:#fff}
button.s{background:var(--bg);color:var(--tx);border:1px solid var(--br)}
.w{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:560px}
th{background:var(--pr);color:#fff;text-align:left;padding:7px 8px;font-size:11px;white-space:nowrap}
td{padding:7px 8px;border-bottom:1px solid var(--br);white-space:nowrap}.n{text-align:right}
.b{padding:2px 8px;border-radius:99px;font-size:11px;font-weight:700}.OK{background:var(--ok)}.BAJO{background:var(--wa)}.AGOTADO,.NEGATIVO{background:var(--er)}.EXCESO{background:var(--in)}
.info{grid-column:1/-1;background:var(--bg);border:1px dashed var(--br);border-radius:8px;padding:8px;color:var(--mu);min-height:34px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}.row input{max-width:280px}
.x{border:0;background:none;color:var(--mu);cursor:pointer;font-size:13px;text-decoration:underline}
.empty{color:var(--mu);text-align:center;padding:24px}
#toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:10px;opacity:0;transition:.25s;pointer-events:none;z-index:20;max-width:90%}
#toast.on{opacity:1}
</style></head><body>

let P={},M={},O={},A={},SV={},SG={},sed=null,sf='',gf='',cm='',csel='',sopen=null,U=null,uid=null,gran='D',rd='',rh='',met='v',af='',aq='',aa='',draft=[],pdate='',pnote='',ofd='',oq='',tab='dash',edit=null,flt='',db=null,dl=null,pend=false;
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=n=>(+n||0).toLocaleString('en-US',{maximumFractionDigits:2});
const usd=n=>'$'+(+n||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const fd=s=>s?s.split('-').reverse().join('/'):'';
const today=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
const ago=d=>new Date(Date.now()-d*864e5-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
const toast=t=>{const e=$('#toast');e.textContent=t;e.className='on';clearTimeout(toast.t);toast.t=setTimeout(()=>e.className='',2800)};
const LS='inv_alimentos_v1',UN=['Unidad','Libra','Kg','Litro','Galón','Caja','Bolsa','Paquete','Botella','Frasco'],MOT=['Venta','Producción','Consumo interno','Merma','Muestra','Ajuste de inventario','Devolución a proveedor'];
const store={
 async init(){
  try{db=await claude.use('db');dl=await claude.use('downloads')}catch(e){}
  try{U=await claude.use('user');uid=await U.id()}catch(e){}
  if(db){$('#mode').textContent='● En línea · datos compartidos';
   db.collection('p').onSnapshot(s=>{P={};s.docs.forEach(d=>P[d.id]=d.data());render()});
   db.collection('m').onSnapshot(s=>{M={};s.docs.forEach(d=>M[d.id]=d.data());render()});
   db.collection('o').onSnapshot(s=>{O={};s.docs.forEach(d=>O[d.id]=d.data());render()});
   db.collection('a').onSnapshot(s=>{A={};s.docs.forEach(d=>A[d.id]=d.data());render()});
   db.collection('v').onSnapshot(s=>{SV={};s.docs.forEach(d=>SV[d.id]=d.data());render()});
   db.collection('g').onSnapshot(s=>{SG={};s.docs.forEach(d=>SG[d.id]=d.data());render()});}
  else{$('#mode').textContent='Solo este dispositivo';try{const x=JSON.parse(localStorage.getItem(LS));P=x.P||{};M=x.M||{};O=x.O||{};A=x.A||{};SV=x.SV||{};SG=x.SG||{}}catch(e){}render(true)}},
 persist(){if(!db)try{localStorage.setItem(LS,JSON.stringify({P,M,O,A,SV,SG}))}catch(e){}},
 async set(c,id,o){({p:P,m:M,o:O,a:A,v:SV,g:SG})[c][id]=o;try{if(db)await db.collection(c).doc(id).set(o);else this.persist()}catch(e){toast('No se pudo guardar: '+(e.message||e))}},
 async del(c,id){delete ({p:P,m:M,o:O,a:A,v:SV,g:SG})[c][id];try{if(db)await db.collection(c).doc(id).delete();else this.persist()}catch(e){toast('No se pudo borrar')}}};

function calc(){const R={},t30=ago(30);
 for(const c in P){const p=P[c];R[c]={...p,ent:0,sal:0,mer:0,tot:p.ini*p.cost,qe:+p.ini,s30:0}}
 for(const m of Object.values(M)){if(m.anulado)continue;const r=R[m.code];if(!r)continue;const q=+m.qty;
  if(m.t=='E'){r.ent+=q;r.tot+=q*m.cost;r.qe+=q}else{r.sal+=q;if(m.motivo=='Merma')r.mer+=q;if(m.date>=t30)r.s30+=q}}
 for(const c in R){const r=R[c];r.stock=+r.ini+r.ent-r.sal;r.avg=r.qe?r.tot/r.qe:+r.cost;r.val=r.stock*r.avg;
  const mx=r.max>0?+r.max:2*r.min;
  r.st=r.stock<0?'NEGATIVO':r.stock==0?'AGOTADO':r.stock<=r.min?'BAJO':(r.max>0&&r.stock>r.max)?'EXCESO':'OK';
  r.buy=r.stock<=r.min?Math.max(mx-r.stock,0):0;r.cov=r.s30>0?r.stock/(r.s30/30):null}
 return R}
const bd=s=>`<span class="b ${s}">${{BAJO:'BAJO MÍNIMO'}[s]||s}</span>`;
const tbl=(h,rows)=>rows.length?`<div class="w"><table><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr>${rows.join('')}</table></div>`:'<div class="empty">Sin datos todavía.</div>';

function vDash(R,L){const ms=today().slice(0,8)+'01',mo=Object.values(M).filter(m=>m.date>=ms&&!m.anulado);
 const sum=(t,f)=>mo.filter(m=>m.t==t&&(!f||f(m))).reduce((a,m)=>a+m.qty*(t=='E'?m.cost:(R[m.code]?.avg||0)),0);
 const cnt=s=>L.filter(r=>r.st==s).length,buy=L.reduce((a,r)=>a+r.buy*r.avg,0);
 const K=[['Productos',L.length],['Valor del inventario',usd(L.reduce((a,r)=>a+r.val,0))],['Agotados',cnt('AGOTADO'),cnt('AGOTADO')?'er':''],['Bajo mínimo',cnt('BAJO'),cnt('BAJO')?'wa':''],['En exceso',cnt('EXCESO')],['Stock negativo',cnt('NEGATIVO'),cnt('NEGATIVO')?'er':''],['Compra sugerida',usd(buy)],['Entradas del mes',usd(sum('E'))],['Salidas del mes (costo)',usd(sum('S'))],['Merma del mes',usd(sum('S',m=>m.motivo=='Merma'))]];
 const al=L.filter(r=>r.st!='OK');
 return `<div class="kpis">${K.map(k=>`<div class="kpi ${k[2]||''}"><span>${k[0]}</span><b>${k[1]}</b></div>`).join('')}</div>
 <div class="card"><h2>Alertas de inventario</h2>${L.length?tbl(['Código','Producto','Stock','Mínimo','Estado','Cobertura'],al.map(r=>`<tr><td>${esc(r.code)}</td><td>${esc(r.name)}</td><td class="n">${fmt(r.stock)} ${esc(r.unit)}</td><td class="n">${fmt(r.min)}</td><td>${bd(r.st)}</td><td class="n">${r.cov==null?'—':fmt(r.cov)+' d'}</td></tr>`)):'<div class="empty">Empieza en la pestaña Productos: agrega o importa tu catálogo.</div>'}${L.length&&!al.length?'<div class="empty">Todo en orden ✔</div>':''}</div>`}

function vProd(R,L){const e=edit&&P[edit],q=flt.toLowerCase(),cats=[...new Set(L.map(r=>r.cat).filter(Boolean))];
 return `<div class="card"><h2>${e?'Editar producto':'Nuevo producto'}</h2>
 <form data-edit="${e?edit:''}" onsubmit="saveProd(event)">
 <label>Código<input name="code" required value="${esc(e?.code)}" ${e?'readonly':''}></label>
 <label>Producto<input name="name" required value="${esc(e?.name)}"></label>
 <label>Categoría<input name="cat" list="cl" value="${esc(e?.cat)}"><datalist id="cl">${cats.map(c=>`<option>${esc(c)}`).join('')}</datalist></label>
 <label>Unidad<select name="unit">${UN.map(u=>`<option ${e?.unit==u?'selected':''}>${u}`).join('')}</select></label>
 <label>Proveedor habitual (opcional)<input name="prov" value="${esc(e?.prov)}"></label>
 <label>Stock inicial<input name="ini" type="number" step="any" min="0" value="${e?.ini??0}"></label>
 <label>Costo inicial USD<input name="cost" type="number" step="any" min="0" value="${e?.cost??0}"></label>
 <label>Stock mínimo<input name="min" type="number" step="any" min="0" value="${e?.min??0}"></label>
 <label>Stock máximo<input name="max" type="number" step="any" min="0" value="${e?.max??0}"></label>
 <div><button class="p">Guardar</button> ${e?'<button type="button" class="s" onclick="edit=null;render(true)">Cancelar</button>':''}</div></form></div>
 <div class="card"><h2>Catálogo</h2><div class="row"><input placeholder="Buscar código o nombre" value="${esc(flt)}" oninput="flt=this.value;$('#pt').innerHTML=pTable()"><button class="s" onclick="expInv()">Exportar CSV</button></div><div id="pt">${pTable()}</div>
 <details style="margin-top:10px"><summary>Importar lista de productos</summary><p class="info" style="min-height:0">Pega una línea por producto: <b>código; producto; unidad</b> (separado por punto y coma, coma o tabulador).</p><textarea id="imp" rows="5"></textarea><br><button class="s" onclick="impProd()" style="margin-top:6px">Importar</button></details></div>`}
function pTable(){const R=calc(),q=flt.toLowerCase();
 return tbl(['Código','Producto','Cat.','Entradas','Salidas','Stock','Costo prom.','Valor','Estado','',''],Object.values(R).sort((a,b)=>a.code.localeCompare(b.code)).filter(r=>!r.del&&(r.code+r.name).toLowerCase().includes(q)).map(r=>`<tr><td>${esc(r.code)}</td><td>${esc(r.name)}</td><td>${esc(r.cat)}</td><td class="n">${fmt(r.ent)}</td><td class="n">${fmt(r.sal)}</td><td class="n"><b>${fmt(r.stock)}</b> ${esc(r.unit)}</td><td class="n">${usd(r.avg)}</td><td class="n">${usd(r.val)}</td><td>${bd(r.st)}</td><td><button class="x" onclick="edit='${r.code}';render(true);scrollTo(0,0)">Editar</button></td><td><button class="x" onclick="delProd('${r.code}')">Borrar</button></td></tr>`))}
const cl=s=>s.toUpperCase().replace(/[^A-Z0-9._-]/g,'');
window.saveProd=async e=>{e.preventDefault();const f=e.target,v=n=>f[n].value.trim(),code=cl(v('code'));
 if(!code||!v('name'))return toast('Código y producto son obligatorios');
 if(!f.dataset.edit&&P[code]&&!P[code].del)return toast('Ese código ya existe');

const MN=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'],SCOL=['#4a4a4a','#b0b0b0','#3b82c4','#a855a8','#c0392b','#8a7a1e','#2a9d9d','#7a5c3e'];
const scol=s=>SCOL[Math.max(Object.keys(SV).sort().indexOf(s.id),0)%SCOL.length];
function dayItems(d){const w=wd(d),o=[];Object.values(SG).filter(g=>g.date==d&&g.estado!='Cancelada'&&SV[g.sid]).forEach(g=>o.push({s:SV[g.sid],g}));Object.values(SV).filter(s=>(s.days||[]).includes(w)&&!Object.values(SG).some(g=>g.sid==s.id&&g.date==d)).forEach(s=>o.push({s}));return o}
function calHtml(){const m=cm||today().slice(0,7),[y,mo]=m.split('-').map(Number),off=(wd(m+'-01')+6)%7,nd=new Date(y,mo,0).getDate(),t=today();
 let h=`<div class="row" style="justify-content:space-between"><button class="s" onclick="calGo(-1)">‹ Anterior</button><b>${MN[mo-1]} ${y}</b><span><button class="s" onclick="cm='';csel='';render(true)">Hoy</button> <button class="s" onclick="calGo(1)">Siguiente ›</button></span></div>`;
 h+=`<div class="row">${Object.values(SV).sort((a,b)=>a.name.localeCompare(b.name)).map(s=>`<span style="font-size:11px"><i style="display:inline-block;width:10px;height:10px;border-radius:3px;background:${scol(s)};margin-right:4px"></i>${esc(s.name)}</span>`).join('')||'<span class="empty" style="padding:0">Registra proveedores y marca sus días de visita para verlos aquí.</span>'}</div>`;
 h+=`<div class="w"><div style="display:grid;grid-template-columns:repeat(7,minmax(84px,1fr));gap:4px;min-width:620px">`+['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'].map(n=>`<div style="text-align:center;font-weight:700;color:var(--mu);font-size:11px">${n}</div>`).join('');
 for(let i=0;i<off;i++)h+='<div></div>';
 for(let d=1;d<=nd;d++){const ds=m+'-'+String(d).padStart(2,'0'),it=dayItems(ds);
  h+=`<div onclick="csel='${ds}';render(true)" style="cursor:pointer;min-height:78px;border:${csel==ds?'2px solid var(--pr)':'1px solid var(--br)'};border-radius:8px;padding:4px;background:${ds==t?'var(--wa)':'var(--card)'}"><b style="font-size:12px">${d}</b>${it.slice(0,3).map(x=>`<div style="font-size:10px;margin-top:2px;padding:1px 4px;border-radius:4px;color:#fff;background:${scol(x.s)};white-space:nowrap;overflow:hidden;text-overflow:ellipsis;${x.g?.estado=='Realizada'?'opacity:.55':''}">${esc(x.s.name)}</div>`).join('')}${it.length>3?`<div style="font-size:10px;color:var(--mu)">+${it.length-3} más</div>`:''}</div>`}
 h+='</div></div>';
 if(csel){const it=dayItems(csel);h+=`<div class="info" style="margin-top:10px"><b>${DN[wd(csel)]} ${fd(csel)} · ${cdw(csel)}</b>${it.length?tbl(['Proveedor','Qué vende','Pedido por','Contacto','Visita'],it.map(x=>`<tr><td><b>${esc(x.s.name)}</b></td><td style="white-space:normal">${esc(prList(x.s))}</td><td>${viaTxt(x.s)}</td><td>${esc(x.s.phone||x.s.contact||'—')}</td><td>${x.g?x.g.estado:'Semanal'}</td></tr>`)):'<div>Ningún proveedor visita este día.</div>'}</div>`}
 return h}
window.calGo=n=>{const [y,mo]=(cm||today().slice(0,7)).split('-').map(Number),d=new Date(y,mo-1+n,1);cm=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');render(true)};
const TABS=[['dash','Panel'],['prod','Productos'],['E','Entradas'],['S','Salidas'],['buy','Compras'],['sup','Proveedores'],['rep','Reportes'],['aud','Auditoría']];
function render(force){const a=document.activeElement;
 if(!force&&a&&/INPUT|SELECT|TEXTAREA/.test(a.tagName)&&$('#v').contains(a)){pend=true;return}
 pend=false;const R=calc(),L=Object.values(R).filter(r=>!r.del).sort((a,b)=>a.code.localeCompare(b.code));
 $('#nav').innerHTML=TABS.map(([k,n])=>`<button class="${k==tab?'on':''}" onclick="go('${k}')">${n}</button>`).join('');
 $('#v').innerHTML=({dash:vDash,prod:vProd,E:(R,L)=>vMov('E',R,L),S:(R,L)=>vMov('S',R,L),buy:vBuy,rep:vRep,aud:vAud,sup:vSup})[tab](R,L);names()}
window.go=k=>{tab=k;flt='';edit=null;render(true);scrollTo(0,0)};
document.addEventListener('focusout',()=>{if(pend)setTimeout(()=>{const a=document.activeElement;if(!(a&&/INPUT|SELECT|TEXTAREA/.test(a.tagName)))render()},150)});
render(true);store.init();
</script></body></html>
